[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: membutuhkan Postgres uji (jaga_klaim_test)",
]

[tool.ruff]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
ignore = ["SIM103"]

[tool.ruff.lint.per-file-ignores]
"app/api/health.py" = ["BLE001"]
"app/services/investigation.py" = ["BLE001"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "app.core.config"
disable_error_code = ["call-arg"]
